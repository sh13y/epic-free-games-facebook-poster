name: Post Free Games to Facebook

on:
  schedule:
    - cron: '0 12 * * *'  # This runs the script every day at 12:00 UTC
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  post_free_games:
    runs-on: ubuntu-latest  # Specifies the runner environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'  # You can adjust the Python version if needed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Install required Python packages

      - name: Run free games script
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}  # Use the secret
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}  # Use the secret
        run: |
          python facebook_poster.py  # Replace with your script name

      - name: Commit and push changes (if needed)
        if: success()
        run: |
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git add posted_games.log
          git commit -m 'Update posted games log'
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
